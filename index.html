<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destiny Institute - Sistem HR (Real-Time Ready)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->

    <!-- HTML5-QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <!-- SheetJS Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }

</head>
<body class="text-slate-800 antialiased overflow-x-hidden">

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="fixed top-5 right-5 z-[300] transform transition-transform duration-300 translate-x-full max-w-sm w-full px-4 pointer-events-none">
        <div id="toastContent" class="bg-white border-l-4 p-4 rounded-xl shadow-2xl flex items-center space-x-3 pointer-events-auto">
            <i id="toastIcon" class="fas text-xl"></i>
            <div>
                <h4 id="toastTitle" class="font-bold text-slate-800">Notifikasi</h4>
                <p id="toastMessage" class="text-sm text-slate-500">Pesan</p>
            </div>
        </div>
    </div>

    <!-- GLOBAL DELETE MODAL -->
    <div id="globalDeleteModal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden z-[250] flex justify-center items-center p-4 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm text-center p-8 transform scale-95 transition-all duration-300" id="globalDeleteModalContent">
            <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-red-100 mb-5"><i class="fas fa-trash-alt text-2xl text-red-500"></i></div>
            <h3 class="text-xl font-bold text-slate-800 mb-2">Konfirmasi Hapus</h3>
            <p class="text-sm text-slate-500 mb-8" id="deleteModalMessage">Apakah Anda yakin ingin menghapus data ini?</p>
            <div class="flex gap-3">
                <button onclick="window.closeDeleteModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition">Batal</button>
                <button id="btnConfirmDelete" class="flex-1 bg-red-500 hover:bg-red-600 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-red-500/30">Ya, Hapus</button>
            </div>
        </div>
    </div>

    <!-- MODAL HAPUS TANGGAL -->
    <div id="modalHapusTanggal" class="fixed inset-0 bg-slate-900 bg-opacity-60 hidden z-[250] flex justify-center items-center p-4 backdrop-blur-sm transition-opacity duration-300 opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-8 transform scale-95 transition-all duration-300" id="modalHapusTanggalContent">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-xl font-bold text-slate-800" id="modalHapusTanggalTitle">Hapus via Tanggal</h3>
                <button onclick="window.tutupModalHapusTanggal()" class="text-slate-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
            </div>
            <p class="text-sm text-slate-500 mb-5">Semua data riwayat pada rentang tanggal ini akan dihapus permanen.</p>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Dari Tanggal</label>
                    <input type="date" id="del_startDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1.5">Sampai Tanggal</label>
                    <input type="date" id="del_endDate" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-red-500 outline-none transition">
                </div>
            </div>
            <button onclick="window.prosesHapusTanggal()" class="w-full bg-red-500 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-red-500/30 flex items-center justify-center">
                <i class="fas fa-trash mr-2"></i>Hapus Data Terpilih
            </button>
        </div>
    </div>

    <!-- GLOBAL QR PREVIEW MODAL -->
    <div id="modalQR" class="fixed inset-0 bg-slate-900 bg-opacity-70 hidden z-[250] flex justify-center items-center p-4 backdrop-blur-sm transition-opacity opacity-0">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm text-center p-8 relative transform scale-95 transition-all" id="modalQRContent">
            <button onclick="window.tutupQR()" class="absolute top-5 right-5 text-slate-400 hover:text-red-500 transition"><i class="fas fa-times text-xl"></i></button>
            <h3 class="font-bold text-slate-800 text-xl mb-1">ID Card (QR Code)</h3>
            <p class="text-sm font-medium text-emerald-600 mb-6" id="qrKaryawanNama">-</p>
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 inline-block mb-6 shadow-inner">
                <img id="qrImage" src="" alt="QR Code" class="w-48 h-48 mx-auto mix-blend-multiply">
            </div>
            <p class="text-xs text-slate-400 mb-6 leading-relaxed">Simpan QR Code ini untuk diserahkan ke Karyawan sebagai alat absensi.</p>
            <button onclick="window.tutupQR()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 rounded-xl transition shadow-lg">Tutup Layar</button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="w-full h-full min-h-screen"></div>

    <script>
        // ==========================================
        // FIREBASE CONFIGURATION (Opsional untuk Real-Time)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAHCb-IGYuJbsZIiqDUmQEGC8H5mSPmR4A",
            authDomain: "absen-destiny.firebaseapp.com",
            databaseURL: "https://absen-destiny-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "absen-destiny",
            storageBucket: "absen-destiny.firebasestorage.app",
            messagingSenderId: "111136151948",
            appId: "1:111136151948:web:b0f8984bb6c8da22d95ea9"
        };
        
        // KARENA API KEY SUDAH ASLI, SAKLAR LANGSUNG DINYALAKAN (TRUE)
        const isFirebaseConfigured = true;
        let isFirebaseConnected = false;
        
        if (isFirebaseConfigured) {
            try {
                let customAudio = null;
                if (type === 'masuk') customAudio = state.pengaturan?.audioMasuk;
                else if (type === 'pulang') customAudio = state.pengaturan?.audioPulang;
                else if (type === 'notif_admin' || type === 'error') customAudio = state.pengaturan?.audioCuti;
                else if (type === 'imk_keluar') customAudio = state.pengaturan?.audioImkKeluar;
                else if (type === 'imk_kembali') customAudio = state.pengaturan?.audioImkKembali;

                if (customAudio) {
                    const audio = new Audio(customAudio);
                    const playPromise = audio.play();
                    if (playPromise !== undefined) { playPromise.catch(e => { playSynthSound(type); }); }
                    return;
                }
                playSynthSound(type);
            } catch(e) {}
        }

        function playSynthSound(type) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext; if (!AudioContext) return;
                const ctx = new AudioContext(); let now = ctx.currentTime; let osc = ctx.createOscillator(); let gain = ctx.createGain();

                if (type === 'masuk' || type === 'imk_keluar') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                } else if (type === 'pulang' || type === 'imk_kembali') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(783.99, now); osc.frequency.setValueAtTime(523.25, now + 0.15);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                } else {
                    osc.type = 'square'; osc.frequency.setValueAtTime(587.33, now); osc.frequency.setValueAtTime(880, now + 0.12);
                    gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                }
                
                osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 0.5);
            } catch(e) {}
        }

        window.handleAudioUpload = function(event, key) {
            const file = event.target.files[0]; if (!file) return;
            if (file.size > 700 * 1024) return showToast("File Terlalu Besar", "Harap pilih file di bawah 700 KB.", "warning");
            const reader = new FileReader();
            reader.onload = function(e) {
                if(!state.pengaturan) state.pengaturan = {}; state.pengaturan[key] = e.target.result; saveData();
                showToast("Audio Disimpan", "File notifikasi berhasil diperbarui!"); if (state.currentView === 'pengaturan') window.render();
            };
            reader.readAsDataURL(file);
        };

        window.hapusAudioKustom = function(key) {
            if(state.pengaturan && state.pengaturan[key]) {
                delete state.pengaturan[key]; saveData(); showToast("Dihapus", "Kembali menggunakan nada bawaan."); if (state.currentView === 'pengaturan') window.render();
            }
        };

        window.tesSuara = function(type) { playSound(type); };

        function formatRupiah(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); }
        function formatDateID(dateString) {
            if (!dateString) return '-'; const options = { year: 'numeric', month: 'long', day: 'numeric' }; return new Date(dateString).toLocaleDateString('id-ID', options);
        }
        function formatWANumber(nomor) {
            if (!nomor) return ''; let cleaned = nomor.replace(/\D/g, ''); if (cleaned.startsWith('0')) return '62' + cleaned.substring(1); return cleaned;
        }

        function showToast(title, message, type = 'success') {
            const toast = document.getElementById('toast'); const toastContent = document.getElementById('toastContent'); const toastIcon = document.getElementById('toastIcon');
            document.getElementById('toastTitle').innerText = title; document.getElementById('toastMessage').innerText = message;
            toastContent.className = 'bg-white border-l-4 p-4 rounded-xl shadow-2xl flex items-center space-x-3 pointer-events-auto'; toastIcon.className = 'fas text-2xl';
            if (type === 'success') { toastContent.classList.add('border-emerald-500'); toastIcon.classList.add('fa-check-circle', 'text-emerald-500'); } 
            else if (type === 'error') { toastContent.classList.add('border-red-500'); toastIcon.classList.add('fa-exclamation-circle', 'text-red-500'); } 
            else if (type === 'warning') { toastContent.classList.add('border-amber-500'); toastIcon.classList.add('fa-exclamation-triangle', 'text-amber-500'); }
            toast.classList.remove('translate-x-full'); setTimeout(() => { toast.classList.add('translate-x-full'); }, 3500);
        }

        function pastikanDataMigrasi() {
            if (!state.pengaturan) state.pengaturan = {};
            if (!state.pengaturan.shifts || state.pengaturan.shifts.length === 0) state.pengaturan.shifts = [ { id: 'shift_1', nama: 'Shift Standar (Pagi)', jamMasuk: '08:00', jamPulang: '17:00' } ];
            if (!state.pengaturan.liburNasional) state.pengaturan.liburNasional = [];
            if (!state.imk) state.imk = [];
        }

        async function saveData() {
            pastikanDataMigrasi(); localStorage.setItem('destinyAbsensiData', JSON.stringify(state));
            if (isFirebaseConnected) { try { await firebase.database().ref('hr_system_data').set(state); } catch (err) {} }
        }

        function loadData() {
            if (isFirebaseConnected) {
                firebase.database().ref('hr_system_data').on('value', (snapshot) => {
                    const data = snapshot.val();
                    if (data) { state = { ...state, ...data }; pastikanDataMigrasi(); localStorage.setItem('destinyAbsensiData', JSON.stringify(state)); if(!isInitialLoad && state.currentUserRole) window.render(); } 
                    else fallbackLocalLoad();
                    if (isInitialLoad) { isInitialLoad = false; window.render(); }
                });
            } else { fallbackLocalLoad(); window.render(); }
        }

        function fallbackLocalLoad() {
            const saved = localStorage.getItem('destinyAbsensiData');
            if (saved) { state = { ...state, ...JSON.parse(saved) }; pastikanDataMigrasi(); }
        }

        window.prosesKehadiran = function(nikScanned, metode = 'QR', lat = null, lng = null) {
            if (isProcessingQR && (metode === 'QR' || metode === 'GPS')) return;
            if (metode === 'QR' || metode === 'GPS') isProcessingQR = true;

            const karyawan = state.karyawan.find(k => k.nik === nikScanned);
            if(!karyawan) {
                playSound('error'); showToast('Akses Ditolak', 'Data tidak dikenali oleh sistem.', 'error');
                if (metode === 'QR' || metode === 'GPS') setTimeout(() => { isProcessingQR = false; }, 3000);
                return;
            }

            const now = new Date(); const timeString = now.toTimeString().substring(0, 5); 
            const dateString = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

            if (kioskModeType === 'imk' && state.currentView === 'scanWajah') {
                if(!state.imk) state.imk = [];
                let imkHariIni = state.imk.find(i => i.karyawanId === karyawan.id && i.tanggal === dateString && !i.jamKembali);

                if (!imkHariIni) {
                    state.imk.push({ id: Date.now(), karyawanId: karyawan.id, tanggal: dateString, jamKeluar: timeString, jamKembali: null, durasi: '-' });
                    saveData(); playSound('imk_keluar'); showToast('IMK: Izin Keluar', `${karyawan.nama} tercatat KELUAR kantor pukul ${timeString}`);
                } else {
                    imkHariIni.jamKembali = timeString;
                    const [hK, mK] = imkHariIni.jamKeluar.split(':').map(Number); const [hB, mB] = timeString.split(':').map(Number);
                    let diffMins = (hB * 60 + mB) - (hK * 60 + mK); if(diffMins < 0) diffMins = 0;
                    imkHariIni.durasi = `${Math.floor(diffMins / 60) > 0 ? Math.floor(diffMins / 60) + ' jam ' : ''}${diffMins % 60} menit`;
                    saveData(); playSound('imk_kembali'); showToast('IMK: Kembali', `${karyawan.nama} KEMBALI ke kantor. Durasi di luar: ${imkHariIni.durasi}`);
                }
            } else {
                let absenHariIni = state.absensi.find(a => a.karyawanId === karyawan.id && a.tanggal === dateString);
                const isLibur = state.pengaturan.liburNasional?.find(l => l.tanggal === dateString);
                const shiftKaryawan = state.pengaturan.shifts?.find(s => s.id === karyawan.shiftId) || state.pengaturan.shifts[0];

                if (!absenHariIni) {
                    let status = isLibur ? 'Hadir (Libur)' : (timeString > (shiftKaryawan?.jamMasuk || '08:00') ? 'Terlambat' : 'Tepat Waktu');
                    state.absensi.push({ id: Date.now(), karyawanId: karyawan.id, tanggal: dateString, jamMasuk: timeString, jamPulang: null, statusMasuk: status, metode: metode, lat: lat, lng: lng });
                    saveData(); playSound('masuk'); showToast('Masuk Berhasil', `Selamat bekerja, ${karyawan.nama}! (${status})`);
                } else if (!absenHariIni.jamPulang) {
                    absenHariIni.jamPulang = timeString; absenHariIni.metodePulang = metode;
                    saveData(); playSound('pulang'); showToast('Pulang Berhasil', `Hati-hati di jalan, ${karyawan.nama}!`);
                } else { playSound('error'); showToast('Informasi', `${karyawan.nama} sudah merampungkan absen hari ini.`, 'warning'); }
            }

            if (metode === 'QR' || metode === 'GPS') setTimeout(() => { isProcessingQR = false; }, 3000);
        };

        async function stopScanner() { if (html5QrCode && html5QrCode.isScanning) { try { await html5QrCode.stop(); html5QrCode.clear(); } catch(err) {} } }
        window.startScanner = function() {
            setTimeout(async () => {
                if (state.currentView !== 'scanWajah' && state.currentView !== 'absenGPS') return; 
                const readerElement = document.getElementById('reader'); if(!readerElement) return;
                if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                if (html5QrCode.isScanning) await stopScanner();
                try {
                    await html5QrCode.start(
                        { facingMode: cameraFacingMode }, { fps: 10, qrbox: { width: 250, height: 250 } },
                        (decodedText) => { if (state.currentView === 'absenGPS') window.prosesGPSLaluAbsen(decodedText); else window.prosesKehadiran(decodedText, 'QR'); },
                        (errorMessage) => {}
                    );
                    document.getElementById('cameraError')?.classList.add('hidden');
                } catch(err) {
                    if(cameraFacingMode === "environment") { cameraFacingMode = "user"; window.startScanner(); return; }
                    const errEl = document.getElementById('cameraError'); if(errEl) { errEl.classList.remove('hidden'); errEl.innerHTML = "<i class='fas fa-video-slash mr-2'></i>Kamera diblokir/tidak terdeteksi."; }
                }
            }, 500);
        };

        window.toggleKioskMode = function(mode) {
            kioskModeType = mode;
            const btnAbsen = document.getElementById('btnModeAbsen'); const btnImk = document.getElementById('btnModeImk');
            const titleEl = document.getElementById('kioskTitle'); const subtitleEl = document.getElementById('kioskSubtitle');
            if(!btnAbsen || !btnImk) return;
            if (mode === 'imk') {
                btnImk.className = "flex-1 bg-amber-600 text-white font-bold py-2.5 rounded-xl shadow transition text-xs"; btnAbsen.className = "flex-1 bg-white/10 text-white/70 font-semibold py-2.5 rounded-xl transition text-xs";
                titleEl.innerText = "Terminal IMK (Keluar/Masuk)"; subtitleEl.innerText = "Scan 1x = Keluar Kantor | Scan ke-2 = Kembali";
            } else {
                btnAbsen.className = "flex-1 bg-emerald-600 text-white font-bold py-2.5 rounded-xl shadow transition text-xs"; btnImk.className = "flex-1 bg-white/10 text-white/70 font-semibold py-2.5 rounded-xl transition text-xs";
                titleEl.innerText = "Terminal Mesin QR"; subtitleEl.innerText = "Dekatkan QR Code ke Kamera";
            }
        };

        window.toggleCamera = function() { cameraFacingMode = (cameraFacingMode === "environment") ? "user" : "environment"; window.startScanner(); };

        window.prosesGPSLaluAbsen = function(nik) {
            if (isProcessingQR) return; isProcessingQR = true;
            const karyawan = state.karyawan.find(k => k.nik === nik);
            if(!karyawan) { playSound('error'); showToast('Akses Ditolak', 'QR Code tidak terdaftar.', 'error'); setTimeout(() => { isProcessingQR = false; }, 3000); return; }
            if (!navigator.geolocation) { playSound('error'); showToast('Gagal', 'Sistem GPS tidak didukung.', 'error'); setTimeout(() => { isProcessingQR = false; }, 3000); return; }

            showToast('Memindai GPS...', 'Mohon tunggu, mengunci titik koordinat lokasi...', 'warning');
            navigator.geolocation.getCurrentPosition(
                (pos) => { isProcessingQR = false; window.prosesKehadiran(nik, 'GPS', pos.coords.latitude, pos.coords.longitude); },
                () => { playSound('error'); showToast('Gagal', 'Izin lokasi (GPS) ditolak atau sinyal lemah.', 'error'); setTimeout(() => { isProcessingQR = false; }, 3000); },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        };

        window.confirmDelete = function(type, id) {
            deleteTarget = { type, id };
            const modal = document.getElementById('globalDeleteModal'); const content = document.getElementById('globalDeleteModalContent'); const msg = document.getElementById('deleteModalMessage');
            if (type === 'semua_absensi') msg.innerText = "Kosongkan SELURUH riwayat absensi secara permanen?";
            else if (type === 'semua_imk') msg.innerText = "Kosongkan SELURUH riwayat IMK secara permanen?";
            else if (type === 'imk') msg.innerText = "Hapus riwayat Izin Keluar Masuk ini?";
            else msg.innerText = `Yakin menghapus data ${type} ini?`;
            modal.classList.remove('hidden'); setTimeout(() => { modal.classList.add('opacity-100'); content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        };

        window.closeDeleteModal = function() {
            const modal = document.getElementById('globalDeleteModal'); const content = document.getElementById('globalDeleteModalContent');
            modal.classList.remove('opacity-100'); content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); deleteTarget = null; }, 300);
        };

        document.getElementById('btnConfirmDelete')?.addEventListener('click', () => {
            if(!deleteTarget) return; const { type, id } = deleteTarget;
            if (type === 'karyawan') state.karyawan = state.karyawan.filter(x => x.id !== id);
            else if (type === 'jabatan') state.jabatan = state.jabatan.filter(x => x.id !== id);
            else if (type === 'absensi') state.absensi = state.absensi.filter(x => x.id !== id);
            else if (type === 'imk') state.imk = state.imk.filter(x => x.id !== id);
            else if (type === 'semua_absensi') state.absensi = [];
            else if (type === 'semua_imk') state.imk = [];
            else if (type === 'shift') state.pengaturan.shifts = state.pengaturan.shifts.filter(x => x.id !== id);
            else if (type === 'libur') state.pengaturan.liburNasional = state.pengaturan.liburNasional.filter(x => x.id !== id);
            
            saveData(); window.closeDeleteModal(); window.render(); showToast('Sukses', 'Proses hapus berhasil');
        });

        window.tampilkanQR = function(nik, nama) {
            const modal = document.getElementById('modalQR'); const content = document.getElementById('modalQRContent');
            document.getElementById('qrKaryawanNama').innerText = nama; document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(nik)}`;
            modal.classList.remove('hidden'); setTimeout(() => { modal.classList.add('opacity-100'); content.classList.remove('scale-95'); content.classList.add('scale-100'); }, 10);
        };
        window.tutupQR = function() {
            const modal = document.getElementById('modalQR'); const content = document.getElementById('modalQRContent');
            modal.classList.remove('opacity-100'); content.classList.remove('scale-100'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        };

        window.bukaModalHapusTanggal = function(mode = 'absensi') {
            activeHapusMode = mode; document.getElementById('del_startDate').value = ''; document.getElementById('del_endDate').value = '';
            document.getElementById('modalHapusTanggalTitle').innerText = mode === 'imk' ? 'Hapus IMK via Tanggal' : 'Hapus Absen via Tanggal';

            const user = document.getElementById('set_user').value; const pass = document.getElementById('set_pass').value;
            if(!user) return showToast('Error', 'Username wajib diisi!', 'error');
            state.pengaturan.adminUsername = user; if(pass) state.pengaturan.adminPassword = pass;
            saveData(); showToast('Aman', 'Kredensial Login diubah.'); document.getElementById('set_pass').value = '';
        };

        window.onload = () => loadData();
    </script>
</body>
</html>
